services:
  simulator:
    build:
      context: .
      dockerfile: docker/Dockerfile.simulator
    env_file:
      - .env
    environment:
      - SIEM_HOST=${SIEM_HOST:-172.17.0.1}
      - SIEM_PORT=${SIEM_PORT:-8080}
      - EVENTS_PER_SECOND=${EVENTS_PER_SECOND:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped